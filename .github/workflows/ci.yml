name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # haftalik xavfsizlik skaneri (TZ 15.10.1)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, mypy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: nazoratchi
          POSTGRES_USER: nazoratchi
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nazoratchi -d nazoratchi"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_PASSWORD: ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov --cov-fail-under=70

  prototype-agent:
    name: prototype agent (lint, mypy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prototype/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: prototype/agent/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov --cov-fail-under=70

  agent:
    name: agent (gofmt, vet, staticcheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go test -race -cover ./...
      - name: amd64 va arm64 (statik, CGO yo'q)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=ci"               -o bin/nazoratchi-agent-$arch ./cmd/nazoratchi-agent
          done
          ls -l bin

  frontend:
    name: frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  appctl:
    name: appctl patch (shellcheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/appctl-patches/appctl
      # SC2034 — asl skriptdagi eski ogohlantirish (for i in ...), o'zgartirilmagan.
      - run: shellcheck -e SC2034 deploy/appctl-patches/appctl
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest pytest deploy/appctl-patches/tests -q

  security:
    name: security (pip-audit, govulncheck)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pip-audit
      - run: uv sync --frozen
        working-directory: prototype/agent
      - run: uv run pip-audit
        working-directory: prototype/agent
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: agent

  backend-image:
    name: backend image (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: nazoratchi-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image ichida django check
        run: >-
          docker run --rm -e SECRET_KEY=ci-only-not-secret-ci-only-not-secret-ci-only-0123456789
          -e ALLOWED_HOSTS=nazoratchi.example.uz -e DB_PASSWORD=ci -e REDIS_URL=redis://redis:6379/0
          -e NAZORATCHI_MASTER_KEY=ZGV2LWtleS1mYXFhdC1pc2hsYWItY2hpcWlzaC0wMDA=
          nazoratchi-backend:ci python manage.py check

  compose:
    name: compose (konfiguratsiya tekshiruvi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.dev.yml config --quiet
      - name: prod compose (.env.example qiymatlari bilan)
        working-directory: deploy
        run: |
          sed -e 's/^SECRET_KEY=.*/SECRET_KEY=x/' -e 's/^DB_PASSWORD=.*/DB_PASSWORD=x/'               -e 's/^NAZORATCHI_MASTER_KEY=.*/NAZORATCHI_MASTER_KEY=x/' -e 's/^GHCR_OWNER=.*/GHCR_OWNER=ci/'               ../.env.example > .env
          docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: shellcheck (install.sh, bootstrap.sh)
        run: shellcheck deploy/agent/install.sh deploy/bootstrap.sh deploy/agent/test.sh deploy/agent/test/run-in-container.sh
      - name: nginx konfiguratsiyasi
        run: |
          sudo apt-get install -y -qq nginx >/dev/null
          echo "proxy_set_header Host \$host;" | sudo tee /etc/nginx/proxy_params >/dev/null
          NAZORATCHI_DOMAIN=nazoratchi.example.uz envsubst "\${NAZORATCHI_DOMAIN}" < deploy/nginx/nazoratchi.conf.template | sudo tee /etc/nginx/conf.d/nazoratchi.conf >/dev/null
          sudo nginx -t

  frontend-image:
    name: frontend image (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  agent-install-test:
    name: install.sh (Debian konteynerida)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/agent/test.sh

# Release (image push, agent imzolash): .github/workflows/release.yml
