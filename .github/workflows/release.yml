name: release

# Teg `v*` (masalan v1.0.0) qo'yilganda: image'lar ghcr.io ga, agent binarlari imzolanib GitHub Release ga (TZ 15.10, 7.7).
# Sirlar: MINISIGN_SECRET_KEY (minisign maxfiy kalit fayli matni), MINISIGN_PASSWORD (parol; kalit parolsiz bo'lsa bo'sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/nazoratchi-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/nazoratchi-backend:latest
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/nazoratchi-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/nazoratchi-frontend:latest
          cache-from: type=gha,scope=frontend

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Binarlarni yig'ish (statik, amd64 va arm64)
        working-directory: agent
        env:
          # Ochiq kalit (maxfiy emas) binarga joylanadi: agent o'z-o'zini yangilashda imzoni shu bilan tekshiradi
          # (14.5.4). Repo o'zgaruvchisi: Settings -> Variables -> MINISIGN_PUBKEY (`.pub` faylning 2-qatori).
          MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBKEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "xato: teg X.Y.Z bo'lishi kerak (agent yangilanishi pre-relizni qabul qilmaydi): $GITHUB_REF_NAME" >&2; exit 1; }
          [ -n "$MINISIGN_PUBKEY" ] || { echo "xato: MINISIGN_PUBKEY repo o'zgaruvchisi yo'q: agent yangilanishni tekshira olmaydi" >&2; exit 1; }
          BUILD_TIME="$(git log -1 --format=%cI)" # commit vaqti: bir xil commit har doim bir xil binar beradi
          mkdir -p ../dist
          printf '%s\n' "$VERSION" > ../dist/VERSION
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.releasePubKey=$MINISIGN_PUBKEY -X main.buildTime=$BUILD_TIME" \
              -o ../dist/nazoratchi-agent-$arch ./cmd/nazoratchi-agent
          done
      - name: SHA256SUMS va minisign imzosi
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq minisign >/dev/null
          # VERSION ham imzolanadi: core yoki hujumchi eski imzolangan binarni "yangi" deb ko'rsata olmaydi.
          sha256sum VERSION nazoratchi-agent-amd64 nazoratchi-agent-arm64 > SHA256SUMS
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/minisign.key"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-dist
          path: dist/
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
