# /etc/nazoratchi/agent.yaml (egasi root:nazoratchi, rejim 0640). TZ 7.6.
# Bo'sh qoldirilgan kalitlar standart qiymat bilan to'ladi; faqat `core.url` majburiy.
# Doimiy token bu faylda EMAS: /etc/nazoratchi/token (0600), `nazoratchi-agent enroll` yozadi.
core:
  url: https://nazoratchi.example.uz    # https majburiy (faqat localhost uchun http ruxsat)
  ca_file: ""                           # ixtiyoriy: o'zi imzolagan CA
  timeout: 10s
  token_file: /etc/nazoratchi/token
host:
  name: ""                              # bo'sh bo'lsa hostname

# Amalga oshirilgan: system, disk, net, docker. Qolganlari sozlanishi mumkin, lekin hozircha ishga tushmaydi
# (agent buni boshlanishda xabar qiladi): diskio, systemd, backup, certs, ssh, apt.
# Docker yo'q serverda `docker.enabled: false` qiling, aks holda har davrda xato hisoblanadi.
collectors:
  system: { enabled: true, interval: 15s }          # 5s..60s
  disk:   { enabled: true, interval: 30s, ignore_fstypes: [tmpfs, overlay, squashfs, devtmpfs] }
  net:    { enabled: true, interval: 15s, ignore_ifaces: ["lo", "veth*", "br-*", "docker0"] }
  docker:
    enabled: true
    interval: 30s
    endpoint: tcp://127.0.0.1:2375       # docker-socket-proxy (faqat GET) yoki unix:///var/run/docker.sock
    max_containers: 100

queue:
  dir: /var/lib/nazoratchi/queue
  max_bytes: 20971520                   # 20 MB
  max_age: 15m
log:
  level: info                           # debug | info | warn | error
