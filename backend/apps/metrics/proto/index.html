<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nazoratchi — prototip grafik</title>
<style>
  :root { --bg:#f7f8fa; --surface:#fff; --text:#1b1f24; --muted:#5c6670; --border:#dde1e6; --line:#2b6fd6; --ok:#1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --surface:#171b21; --text:#e6e9ed; --muted:#98a2ad; --border:#2a313a; --line:#5c9dff; --ok:#3ccf7a; } }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:980px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  select, button { font:inherit; padding:6px 8px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; }
  svg { width:100%; height:auto; display:block; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .big { font-size:28px; font-weight:600; }
  .fresh { color:var(--ok); }
  .stale { color:#c98a00; }
</style>
</head>
<body>
<main>
  <h1>Nazoratchi · prototip</h1>
  <div class="bar">
    <label>Server <select id="server"></select></label>
    <label>Metrika <select id="metric"></select></label>
    <label>Oraliq
      <select id="range">
        <option value="900">15 daqiqa</option>
        <option value="3600" selected>1 soat</option>
        <option value="21600">6 soat</option>
        <option value="86400">24 soat</option>
        <option value="604800">7 kun</option>
      </select>
    </label>
    <button id="refresh" type="button">Yangilash</button>
  </div>
  <div class="card">
    <div><span class="big" id="last">—</span> <span id="fresh" class="meta"></span></div>
    <svg id="chart" viewBox="0 0 900 320" role="img" aria-label="Metrika grafigi"></svg>
    <div class="meta" id="meta"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let seriesList = [];

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}
function option(value, text) { const o = document.createElement("option"); o.value = value; o.textContent = text; return o; }
function labelText(l) { const k = Object.keys(l); return k.length ? " {" + k.map((x) => x + "=" + l[x]).join(",") + "}" : ""; }
function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

async function loadServers() {
  const data = await getJSON("/api/v1/servers");
  const sel = $("server"); sel.replaceChildren();
  data.items.forEach((s) => sel.appendChild(option(s.id, s.name)));
  if (data.items.length) await loadNames();
}
async function loadNames() {
  const id = $("server").value;
  const data = await getJSON("/api/v1/metrics/names?server_id=" + encodeURIComponent(id));
  seriesList = data.items;
  const sel = $("metric"); const prev = sel.value; sel.replaceChildren();
  seriesList.forEach((s, i) => sel.appendChild(option(String(i), s.name + labelText(s.labels))));
  const want = seriesList.findIndex((s) => s.name === "cpu_busy_percent");
  sel.value = prev && seriesList[Number(prev)] ? prev : String(want >= 0 ? want : 0);
  await draw();
}
async function draw() {
  const s = seriesList[Number($("metric").value)];
  const svg = $("chart"); svg.replaceChildren();
  if (!s) { $("meta").textContent = "Ma'lumot yo'q."; return; }
  const to = new Date(), from = new Date(to.getTime() - Number($("range").value) * 1000);
  let q = "/api/v1/metrics/query?server_id=" + encodeURIComponent($("server").value)
        + "&name=" + encodeURIComponent(s.name) + "&from=" + from.toISOString() + "&to=" + to.toISOString();
  for (const k in s.labels) q += "&labels[" + encodeURIComponent(k) + "]=" + encodeURIComponent(s.labels[k]);
  const data = await getJSON(q);
  const pts = (data.series[0] || { points: [] }).points;
  const W = 900, H = 320, L = 56, R = 12, T = 12, B = 28;
  if (!pts.length) { $("last").textContent = "—"; $("meta").textContent = "Bu oraliqda nuqta yo'q."; return; }
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = from.getTime(), x1 = to.getTime();
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (s.unit === "%") { y0 = 0; y1 = Math.max(100, y1); }
  if (y1 === y0) y1 = y0 + 1;
  const px = (x) => L + (x - x0) / (x1 - x0) * (W - L - R);
  const py = (y) => H - B - (y - y0) / (y1 - y0) * (H - T - B);
  const grid = css("--border"), muted = css("--muted"), line = css("--line");
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = py(v);
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: grid }));
    svg.appendChild(el("text", { x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: muted }, v.toFixed(v < 10 ? 1 : 0)));
  }
  for (let i = 0; i <= 4; i++) {
    const t = new Date(x0 + (x1 - x0) * i / 4);
    svg.appendChild(el("text", { x: px(t.getTime()), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: muted },
      t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })));
  }
  // Ma'lumot yo'q oraliq (> 3 qadam) — chiziq uziladi, tutashtirilmaydi (TZ 13.4.4).
  const gap = data.step_seconds * 3 * 1000;
  let d = "";
  pts.forEach((p, i) => { d += (i === 0 || p[0] - pts[i - 1][0] > gap ? "M" : "L") + px(p[0]).toFixed(1) + " " + py(p[1]).toFixed(1) + " "; });
  svg.appendChild(el("path", { d, fill: "none", stroke: line, "stroke-width": 1.8 }));
  const last = ys[ys.length - 1];
  $("last").textContent = last.toFixed(last < 10 ? 2 : 1) + (s.unit ? " " + s.unit : "");
  const age = Math.round((Date.now() - xs[xs.length - 1]) / 1000);
  const f = $("fresh"); f.textContent = "yangilandi: " + age + " s oldin"; f.className = "meta " + (age > 60 ? "stale" : "fresh");
  $("meta").textContent = pts.length + " nuqta · manba: " + data.source + " · qadam: " + data.step_seconds + " s";
}
$("server").addEventListener("change", loadNames);
$("metric").addEventListener("change", draw);
$("range").addEventListener("change", draw);
$("refresh").addEventListener("click", draw);
loadServers().catch((e) => { $("meta").textContent = String(e); });
setInterval(() => { draw().catch(() => {}); }, 5000);
</script>
</body>
</html>
