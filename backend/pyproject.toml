[project]
name = "nazoratchi-backend"
version = "0.1.0"
description = "Nazoratchi — infratuzilma monitoringi platformasi (core)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["config/asgi.py", "config/wsgi.py"]
