server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Vite fayl nomlariga xesh qo'yadi: abadiy kesh. index.html esa har safar tekshiriladi.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;   # SPA marshrutlari
    }
}
